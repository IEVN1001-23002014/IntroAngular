<div class="card">
    <div class="card-header">
        <div class="card-body">
            <div class="row"></div>
                <div class="col-md-2">
                     Filtrar por:
                </div>
                   
                <div class="col-md-4">
                    <input [(ngModel)]="listfilter" type="text" class="form-control"
                    placeholder="Ingrese nombre del Heroe">
                </div>
            <div class="row">
                <div class="col-md-6">
                    <h3>Filtro:{{listfilter}}</h3>
                </div>
            </div>
            <div class="table-responsive">
                <div class="table-responsive">
                    <table *ngIf="heroes.length" class="table table-striped">
                        <thead>
                            <tr>
                                <th><button (click)="showImage()" class="btn btn-primary" >{{muestraImage?'Oculta':'muestra'}}Imagen</button></th>
                                <th>Nombre</th>
                                <th>Descripcion</th>
                                <th>Raza</th>
                                <th>Ki</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let heroe of heroes | heroesFilter:listfilter">
                                <td><img *ngIf="muestraImage" [src]="heroe.imagen"
                                    [style.width.px]="imageWidth" [style.margin.px]="imageMargin"/></td>
                                <td>{{heroe.nombre |uppercase}}</td>
                                <td>{{heroe.description}}</td>
                                <td>{{heroe.race}}</td>
                                <td>{{heroe.ki}}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
