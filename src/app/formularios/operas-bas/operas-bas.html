<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
    <div class="container">
       <div class="col-6">
        <form>
            <!-- Entradas de números -->
            <div class="form-group pt-4">
                <label for="num1">Número 1:</label>
                <input [(ngModel)]="num1" name="num1" type="number" class="form-control">
            </div>
            <div class="form-group pt-4">
                <label for="num2">Número 2:</label>
                <input [(ngModel)]="num2" name="num2" type="number" class="form-control">
            </div>
            
            <br/>

            <!-- 1. Selección de operación con Radio Buttons -->
            <label><strong>Selecciona una operación:</strong></label>
            
            <div class="form-check">
                <input class="form-check-input" type="radio" name="operacion" id="opSuma" value="sumar" [(ngModel)]="operacion">
                <label class="form-check-label" for="opSuma">Sumar</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="operacion" id="opResta" value="restar" [(ngModel)]="operacion">
                <label class="form-check-label" for="opResta">Restar</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="operacion" id="opMulti" value="multiplicar" [(ngModel)]="operacion">
                <label class="form-check-label" for="opMulti">Multiplicar</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="operacion" id="opDiv" value="dividir" [(ngModel)]="operacion">
                <label class="form-check-label" for="opDiv">Dividir</label>
            </div>

            <br/>

            <!-- 2. Botón para ejecutar el cálculo -->
            <button (click)="calcular()" type="button" class="btn btn-primary mt-3">
                Calcular
            </button>

        </form>
       </div>

       <!-- Resultado -->
       <div class="col-6 mt-4">
            <h2>Resultado: {{resultado}}</h2>
       </div>
    </div>
</body>
</html>
